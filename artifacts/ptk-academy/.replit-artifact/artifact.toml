kind = "web"
previewPath = "/"
title = "PTK Academy"
version = "1.0.0"
id = "artifacts/ptk-academy"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19958

[services.development]
run = "pnpm --filter @workspace/ptk-academy run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ptk-academy", "run", "build" ]
serve = "static"
publicDir = "artifacts/ptk-academy/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19958"
BASE_PATH = "/"
